<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="initial-scale=1,user-scalable=no,width=device-width">
  <title>Math Placement Test &lsaquo; Kids STEM Studio</title>

  <!-- Pre-render auth check -->
  <script>
    const sess = localStorage.getItem('kss_session') || sessionStorage.getItem('kss_session');
    if (!sess) {
      window.location.href = '../login/index.html';
    }
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Stylesheet -->
  <link rel="stylesheet" href="exam.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between">

  <!-- REUSABLE HEADER -->
  <kss-header></kss-header>

  <!-- PROGRESS TIMELINE BAR -->
  <section class="max-w-4xl w-full mx-auto px-6 mt-8">
    <div class="bg-white rounded-2xl p-4 flex items-center justify-between shadow-sm border border-slate-100">
      <div class="flex items-center space-x-3">
        <div class="timeline-step bg-emerald-500 text-white">✓</div>
        <span class="text-xs md:text-sm font-bold text-slate-700">Student Info</span>
      </div>
      <div class="h-[2px] flex-1 bg-slate-200 mx-4"></div>
      <div class="flex items-center space-x-3">
        <div class="timeline-step bg-emerald-500 text-white">✓</div>
        <span class="text-xs md:text-sm font-bold text-slate-700">Instructions</span>
      </div>
      <div class="h-[2px] flex-1 bg-slate-200 mx-4"></div>
      <div class="flex items-center space-x-3">
        <div class="timeline-step bg-sky-500 text-white ring-4 ring-sky-500/20">3</div>
        <span class="text-xs md:text-sm font-bold text-slate-700">Placement Test</span>
      </div>
      <div class="h-[2px] flex-1 bg-slate-200 mx-4"></div>
      <div class="flex items-center space-x-3">
        <div class="timeline-step bg-slate-200 text-slate-400">4</div>
        <span class="text-xs md:text-sm font-bold text-slate-700">Results</span>
      </div>
    </div>
  </section>

  <!-- MAIN EXAM CONTAINER -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-6 py-10 flex flex-col justify-center">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

      <!-- LEFT SIDEBAR -->
      <aside class="lg:col-span-3 bg-white p-6 rounded-card border border-slate-100 space-y-6 shadow-sm">
        <h4 class="font-extrabold text-navy-dark text-base">Progress Panel</h4>
        <div id="sidebar-questions" class="grid grid-cols-5 gap-2.5">
          <!-- Populated dynamically -->
        </div>

        <div class="pt-4 border-t border-slate-100 space-y-3">
          <span id="timer-display" class="font-black text-slate-600 block text-sm">Time: 00:00</span>
          <button onclick="window.scratchpad.open()" class="w-full py-2.5 rounded-xl bg-teal-50 text-teal-700 border border-teal-200 text-xs font-extrabold hover:bg-teal-100 transition-colors">
            📝 Open Scratchpad
          </button>
        </div>
      </aside>

      <!-- MAIN QUESTION CARD -->
      <div class="lg:col-span-9 space-y-6">
        <!-- Progress bar -->
        <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
          <div id="progress-bar-fill" class="bg-sky-500 h-full transition-all duration-300" style="width: 10%;"></div>
        </div>

        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <span id="question-number-display" class="font-black text-slate-600 text-sm">Question 1 of 15</span>
            <span id="exam-streak-badge" class="streak-badge">
              <span>🔥</span>
              <span>Streak: <span id="exam-streak-count">0</span></span>
            </span>
          </div>

          <button onclick="openGlobalModal('exit-modal')" class="px-4 py-2 bg-rose-50 text-rose-600 rounded-full font-bold text-xs hover:bg-rose-100 transition-colors">
            Save & Exit
          </button>
        </div>

        <!-- Dynamic Question Content -->
        <div class="bg-white p-8 md:p-12 rounded-card card-shadow border border-slate-100" id="question-container">
          <!-- Rendered via exam.js -->
        </div>

        <!-- Navigation Buttons -->
        <div class="flex items-center justify-between">
          <button onclick="window.examEngine.prevQuestion()" class="px-6 py-3 rounded-xl border-2 border-slate-200 font-bold text-slate-600 hover:bg-slate-50 transition-colors">
            Previous Question
          </button>
          <button onclick="window.examEngine.nextQuestion()" class="px-8 py-3 rounded-xl btn-blue-gradient text-white font-bold shadow-md">
            Next Question →
          </button>
        </div>
      </div>

    </div>
  </main>

  <!-- REUSABLE FOOTER -->
  <kss-footer></kss-footer>

  <!-- EXIT CONFIRMATION MODAL -->
  <div id="exit-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white max-w-md w-full rounded-2xl p-6 space-y-4 shadow-2xl text-center">
      <span class="text-4xl block">💾</span>
      <h3 class="text-xl font-black text-navy-dark">Save Progress & Exit?</h3>
      <p class="text-xs text-slate-500 font-semibold leading-relaxed">
        Your test progress is automatically saved. You can resume anytime from this browser.
      </p>
      <div class="flex items-center gap-3 pt-2">
        <button onclick="closeGlobalModal('exit-modal')" class="flex-1 py-3 border border-slate-200 rounded-xl font-bold text-slate-600 text-xs">
          Cancel
        </button>
        <button onclick="window.location.href='../portal/index.html'" class="flex-1 py-3 bg-rose-600 text-white rounded-xl font-bold text-xs shadow-md">
          Exit to Portal
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="exam.js"></script>
</body>
</html>
