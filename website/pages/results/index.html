<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="initial-scale=1,user-scalable=no,width=device-width">
  <title>Assessment Results &lsaquo; Kids STEM Studio</title>

  <!-- Pre-render auth check -->
  <script>
    const sess = localStorage.getItem('kss_session') || sessionStorage.getItem('kss_session');
    if (!sess) {
      window.location.href = '../login/index.html';
    }
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="results.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between">

  <!-- REUSABLE HEADER -->
  <kss-header></kss-header>

  <!-- PROGRESS TIMELINE BAR -->
  <section class="max-w-4xl w-full mx-auto px-6 mt-8">
    <div class="bg-white rounded-2xl p-4 flex items-center justify-between shadow-sm border border-slate-100">
      <div class="flex items-center space-x-3">
        <div class="timeline-step bg-emerald-500 text-white">1</div>
        <span class="text-xs md:text-sm font-bold text-slate-700">Student Info</span>
      </div>
      <div class="h-[2px] flex-1 bg-slate-200 mx-4"></div>
      <div class="flex items-center space-x-3">
        <div class="timeline-step bg-emerald-500 text-white">2</div>
        <span class="text-xs md:text-sm font-bold text-slate-700">Instructions</span>
      </div>
      <div class="h-[2px] flex-1 bg-slate-200 mx-4"></div>
      <div class="flex items-center space-x-3">
        <div class="timeline-step bg-emerald-500 text-white">3</div>
        <span class="text-xs md:text-sm font-bold text-slate-700">Placement Test</span>
      </div>
      <div class="h-[2px] flex-1 bg-slate-200 mx-4"></div>
      <div class="flex items-center space-x-3">
        <div class="timeline-step bg-emerald-500 text-white ring-4 ring-emerald-500/20">4</div>
        <span class="text-xs md:text-sm font-bold text-slate-700">Results</span>
      </div>
    </div>
  </section>

  <!-- MAIN RESULTS CONTAINER -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-6 py-10 flex flex-col justify-center">
    <div id="results-content" class="bg-white p-8 md:p-12 results-hero-card border border-slate-100 text-center space-y-8">
      
      <!-- Trophy Icon / Illustration -->
      <div class="flex justify-center">
        <img src="https://math.kidsstemstudio.com/wp-content/uploads/2026/07/success_celebration_illustration_1782954288674.jpg"
             alt="Celebration" class="max-w-[160px] h-auto rounded-2xl shadow-sm object-contain">
      </div>

      <div class="space-y-2">
        <h2 class="text-3xl md:text-4xl font-black text-navy-dark">Great Job!</h2>
        <p class="text-slate-500 font-semibold text-sm">You have completed your adaptive math assessment.</p>
      </div>

      <!-- Recommendation Banner -->
      <div class="bg-emerald-50 p-6 rounded-2xl border border-emerald-200 space-y-2 text-center">
        <span class="text-xs font-black text-emerald-700 uppercase tracking-widest block">Recommended Math Benchmark</span>
        <h3 id="placement-recommendation" class="text-2xl md:text-3xl font-black text-emerald-900">Calibrating Level...</h3>
        <p id="score-details" class="text-sm text-emerald-700 font-bold"></p>
        <p id="time-details" class="text-xs text-emerald-600 font-medium"></p>
      </div>

      <!-- Action buttons -->
      <div class="flex flex-col sm:flex-row items-center justify-center gap-4 pt-2">
        <button onclick="window.location.href='../practice/index.html'" class="w-full sm:w-auto px-8 py-4 rounded-2xl btn-blue-gradient text-base font-black shadow-lg">
          Jump into Recommended Worksheets
        </button>
        <button onclick="window.location.href='../portal/index.html'" class="w-full sm:w-auto px-6 py-4 rounded-2xl border-2 border-slate-200 text-slate-700 font-extrabold hover:bg-slate-50 transition-colors text-sm">
          Return to Dashboard
        </button>
      </div>

      <!-- Question Review Section -->
      <div class="text-left space-y-6 pt-8 border-t border-slate-100">
        <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
          <div>
            <h3 class="text-2xl font-black text-navy-dark">Detailed Question Review</h3>
            <p class="text-xs text-slate-500 font-medium">Review your responses, correct solutions, and step-by-step explanations.</p>
          </div>
          <!-- Filter Buttons -->
          <div class="flex items-center space-x-2 bg-slate-100 p-1.5 rounded-xl">
            <button onclick="window.resultsController.setFilter('all')" id="filter-btn-all" class="px-4 py-2 text-xs font-extrabold rounded-lg bg-white text-navy-dark shadow-sm">All</button>
            <button onclick="window.resultsController.setFilter('incorrect')" id="filter-btn-incorrect" class="px-4 py-2 text-xs font-extrabold rounded-lg text-rose-600 hover:bg-white/50">Needs Review</button>
            <button onclick="window.resultsController.setFilter('correct')" id="filter-btn-correct" class="px-4 py-2 text-xs font-extrabold rounded-lg text-emerald-600 hover:bg-white/50">Correct</button>
          </div>
        </div>

        <div id="fluid-question-breakdown" class="space-y-4"></div>
      </div>

    </div>
  </main>

  <!-- REUSABLE FOOTER -->
  <kss-footer></kss-footer>

  <script type="module" src="results.js"></script>
</body>
</html>
